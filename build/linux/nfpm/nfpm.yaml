# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "querybox"
arch: ${GOARCH}
platform: "linux"
version: "0.1.1"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "A querybox application"
vendor: "My Company"
homepage: "https://wails.io"
license: "MIT"
release: "1"

contents:
  # Main binary lives under /usr/lib/querybox so that the bundled plugins
  # directory sits at /usr/lib/querybox/bin/plugins – the path that
  # bundledPluginsDir() resolves to after following the symlink below.
  - src: "./bin/querybox"
    dst: "/usr/lib/querybox/querybox"
    file_info:
      mode: 0755

  # Symlink keeps the binary on PATH without changing the resolved exe dir.
  - src: "/usr/lib/querybox/querybox"
    dst: "/usr/bin/querybox"
    type: symlink

  # Bundled plugin executables – copied to the per-user config dir on first run.
  - src: "./bin/plugins/*"
    dst: "/usr/lib/querybox/bin/plugins/"
    file_info:
      mode: 0755

  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/querybox.png"
  - src: "./build/linux/querybox.desktop"
    dst: "/usr/share/applications/querybox.desktop"

# Default dependencies for Ubuntu 24.04+ with Wails v3 GTK4 / WebKitGTK 6.0
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats and WebKit versions
overrides:
  # RPM packages for modern Fedora/RHEL-family distributions with WebKitGTK 6.0
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages with WebKitGTK 6.0
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

