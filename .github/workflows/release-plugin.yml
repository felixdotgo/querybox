name: Release Plugin

on:
  push:
    tags:
      - 'plugin-*-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.meta.outputs.plugin }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version

      - name: Extract plugin name and version
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          AFTER="${TAG#plugin-}"
          PLUGIN="${AFTER%-v*}"
          VERSION="${TAG##*-v}"
          echo "plugin=$PLUGIN" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Build plugin
        run: |
          PLUGIN="${{ steps.meta.outputs.plugin }}"
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
          go build -trimpath -buildvcs=false -ldflags="-w -s" \
          -o bin/plugins/${PLUGIN}-linux-amd64 ./plugins/${PLUGIN}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: bin/plugins/

  build-darwin-arm64:
    name: Build (macOS arm64)
    runs-on: macos-latest
    outputs:
      plugin: ${{ steps.meta.outputs.plugin }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version

      - name: Extract plugin name
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          AFTER="${TAG#plugin-}"
          PLUGIN="${AFTER%-v*}"
          echo "plugin=$PLUGIN" >> "$GITHUB_OUTPUT"

      - name: Build plugin (arm64)
        run: |
          PLUGIN="${{ steps.meta.outputs.plugin }}"
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
          CGO_CFLAGS="-mmacosx-version-min=10.15" \
          CGO_LDFLAGS="-mmacosx-version-min=10.15" \
          go build -trimpath -buildvcs=false -ldflags="-w -s" \
          -o bin/plugins/${PLUGIN}-darwin-arm64 ./plugins/${PLUGIN}

      - uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64-artifact
          path: bin/plugins/

  build-darwin-amd64:
    name: Build (macOS amd64)
    runs-on: macos-13
    outputs:
      plugin: ${{ steps.meta.outputs.plugin }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version

      - name: Extract plugin name
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          AFTER="${TAG#plugin-}"
          PLUGIN="${AFTER%-v*}"
          echo "plugin=$PLUGIN" >> "$GITHUB_OUTPUT"

      - name: Build plugin (amd64)
        run: |
          PLUGIN="${{ steps.meta.outputs.plugin }}"
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
          CGO_CFLAGS="-mmacosx-version-min=10.15" \
          CGO_LDFLAGS="-mmacosx-version-min=10.15" \
          go build -trimpath -buildvcs=false -ldflags="-w -s" \
          -o bin/plugins/${PLUGIN}-darwin-amd64 ./plugins/${PLUGIN}

      - uses: actions/upload-artifact@v4
        with:
          name: darwin-amd64-artifact
          path: bin/plugins/

  build-darwin-universal:
    name: Build (macOS universal)
    runs-on: macos-latest
    needs: [build-darwin-arm64, build-darwin-amd64]
    steps:
      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: darwin-arm64-artifact
          path: bin/plugins/

      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: darwin-amd64-artifact
          path: bin/plugins/

      - name: Create universal binary
        run: |
          PLUGIN="${{ needs.build-darwin-arm64.outputs.plugin }}"
          lipo -create \
            -output bin/plugins/${PLUGIN}-darwin-universal \
            bin/plugins/${PLUGIN}-darwin-arm64 \
            bin/plugins/${PLUGIN}-darwin-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: darwin-artifact
          path: bin/plugins/*-darwin-universal

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    outputs:
      plugin: ${{ steps.meta.outputs.plugin }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version

      - name: Extract plugin name
        id: meta
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          AFTER="${TAG#plugin-}"
          PLUGIN="${AFTER%-v*}"
          echo "plugin=$PLUGIN" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        shell: bash
        run: |
          PLUGIN="${{ steps.meta.outputs.plugin }}"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
          go build -trimpath -buildvcs=false -ldflags="-w -s" \
          -o bin/plugins/${PLUGIN}-windows-amd64.exe ./plugins/${PLUGIN}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: bin/plugins/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-darwin-universal, build-windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          name: Plugin ${{ needs.build-linux.outputs.plugin }} v${{ needs.build-linux.outputs.version }}
          generate_release_notes: false
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
